<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Markdownタスクの予定時間と実績時間を、ブラウザだけで管理します。">
  <title>予実管理 | Plan vs Actual Manager</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="../" class="back" aria-label="ツール一覧へ戻る">←</a>
    <div><span class="brand-mark" aria-hidden="true">◷</span><strong>予実管理</strong></div>
    <span class="local-badge">端末内に保存</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">PLAN VS ACTUAL MANAGER</p>
      <h1>予定と実績を、<br><em>ひと目で。</em></h1>
      <p>Markdownのタスクを貼り付けるだけ。進捗や階層はそのままに、時間だけをすっきり管理します。</p>
    </section>

    <section class="workspace" aria-label="予実管理ワークスペース">
      <div class="import-panel">
        <div class="section-title"><span>01</span><div><h2>Markdownを読み込む</h2><p>チェックリストをそのまま貼り付けてください</p></div></div>
        <textarea id="markdown-input" rows="8" spellcheck="false" placeholder="- [ ] タスク名 【進捗: 0%】&#10;  - [ ] 子タスク 【進捗: 0%】"></textarea>
        <div class="import-actions">
          <span id="save-status" role="status">入力内容は自動保存されます</span>
          <button id="load-button" class="primary" type="button">タスクを読み込む <span>→</span></button>
        </div>
        <p id="parse-message" class="message" role="alert" hidden></p>
      </div>

      <section id="editor-section" class="editor-section" hidden>
        <div class="summary-header">
          <div class="section-title"><span>02</span><div><h2>時間を入力</h2><p id="task-count">0件のタスク</p></div></div>
          <div class="summary" aria-label="時間集計">
            <div><small>予定合計</small><strong><span id="plan-total">0</span><i>分</i></strong></div>
            <div><small>実績合計</small><strong><span id="actual-total">0</span><i>分</i></strong></div>
            <div id="total-diff-card"><small>差分</small><strong id="total-diff">±0分</strong></div>
          </div>
        </div>
        <div id="task-list" class="task-list"></div>
        <div class="output-actions">
          <button id="export-button" class="primary export" type="button">Markdownを出力 <span>↗</span></button>
          <button id="clear-button" class="danger" type="button">全データ削除</button>
        </div>
      </section>

      <section id="output-section" class="output-section" hidden>
        <div class="section-title"><span>03</span><div><h2>出力Markdown</h2><p>予実情報を更新しました</p></div></div>
        <div class="output-wrap">
          <textarea id="markdown-output" rows="9" readonly></textarea>
          <button id="copy-button" type="button">コピー</button>
        </div>
        <p id="copy-status" class="copy-status" aria-live="polite"></p>
      </section>
    </section>
  </main>
  <footer>データは外部に送信されません。すべての処理はこのブラウザ内で完結します。</footer>
</body>
</html>
